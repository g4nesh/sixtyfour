name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run security:audit

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build verified production image
        run: docker build --target runner --tag atlas:${{ github.sha }} .
      - name: Smoke-test production health
        run: |
          docker run --detach --name atlas-smoke --env PORT=8080 --publish 127.0.0.1:3000:8080 atlas:${{ github.sha }}
          trap 'docker logs atlas-smoke; docker rm --force atlas-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/atlas-health.json; then
              break
            fi
            sleep 1
          done
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync("/tmp/atlas-health.json", "utf8"));
            if (value.status !== "ok" || value.liveConfigured !== false) process.exit(1);
          '
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/fonts/Geist-Variable.woff2
