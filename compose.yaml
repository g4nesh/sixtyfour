services:
  atlas:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    environment:
      ATLAS_LIVE_ENABLED: ${ATLAS_LIVE_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-5.4}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost:3000}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Atlas People Intelligence}
    init: true
