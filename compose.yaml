services:
  atlas:
    build:
      context: .
      target: runner
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ATLAS_LIVE_ENABLED: ${ATLAS_LIVE_ENABLED:-false}
      ATLAS_ALLOW_UNAUTHENTICATED_LOCAL: "true"
      ATLAS_API_TOKEN: ${ATLAS_API_TOKEN:-}
      LIVE_PROVIDER: ${LIVE_PROVIDER:-}
      LIVE_SEARCH_PROVIDER: ${LIVE_SEARCH_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_SEARCH_MODEL: ${OPENAI_SEARCH_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-5.4}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost:3000}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Atlas}
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
